# pnpm 11 reads project settings from this file even for a single package.
# These versions were newer than pnpm's minimum release age when installed.
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.1'
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/react-query@5.105.1'
  - react-resizable-panels@4.16.0
