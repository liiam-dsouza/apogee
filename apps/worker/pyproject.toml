[project]
name = "apogee-worker"
version = "0.1.0"
description = "Job consumer: runs simcore jobs from the Redis queue. No HTTP."
requires-python = ">=3.13,<3.14"
dependencies = [
  "simcore",
  "arq>=0.28",
  "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apogee_worker"]
