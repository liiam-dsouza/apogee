[project]
name = "apogee-api"
version = "0.1.0"
description = "Thin HTTP layer: validate, enqueue, serialise. All physics lives in simcore."
requires-python = ">=3.13,<3.14"
dependencies = [
  "simcore",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "sqlmodel>=0.0.48",
  "pydantic-settings>=2.7",
  "arq>=0.28",  # enqueues jobs; also pins the redis client the worker uses
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apogee_api"]
