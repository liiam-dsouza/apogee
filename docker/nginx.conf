# Included inside nginx's http {} block.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS; lets optional services (tiles) be absent without nginx failing to start.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE progress streams and the HIL WebSocket.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 50m;  # .ork files and mission bundles
  }

  location /tiles/ {
    set $tiles http://tiles:80;
    rewrite ^/tiles/(.*)$ /$1 break;
    proxy_pass $tiles;
  }

  # Vite fingerprints these; cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/missions, /dispersion, ...) all serve the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
